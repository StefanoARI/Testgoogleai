name: Deploy Automatico su VHosting

on:
  push:
    branches:
      - main # Cambia in 'master' se il tuo ramo si chiama master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Caricamento file su VHosting via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: 100100siti.it/Testgoogleai/
          protocol: sftp
          port: 22